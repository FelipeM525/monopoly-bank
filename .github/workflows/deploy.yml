name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2 via SSH
    runs-on: ubuntu-latest
    # Only runs once EC2_HOST is configured in GitHub Repository Secrets
    if: ${{ vars.ENABLE_AWS_DEPLOY == 'true' }}

    steps:
      - name: Deploy latest main branch on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ~/monopoly-bank
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yaml up --build -d --remove-orphans
            docker image prune -f
