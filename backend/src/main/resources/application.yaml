server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: monopoly-bank
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monopoly}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

game:
  rules:
    starting-balance-cents: ${GAME_STARTING_BALANCE_CENTS:150000}
    salary-cents: ${GAME_SALARY_CENTS:20000}
    min-players: ${GAME_MIN_PLAYERS:2}
    max-players: ${GAME_MAX_PLAYERS:6}
    bank:
      initial-cash-cents: ${GAME_BANK_INITIAL_CASH_CENTS:2000000}
      unlimited: ${GAME_BANK_UNLIMITED:false}
    reasons:
      - Purchase
      - Rent
      - Tax
      - Salary
      - Other
